<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมจับคู่การออม และการลงทุน</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#e3f9ec,#fff7d6);
  min-height:100vh;color:#24324a;
}
header{position:relative;text-align:center;padding:20px 15px 10px}
.creator-logo{
  position:absolute;top:15px;left:18px;
  width:100px;height:100px;object-fit:contain;
  border-radius:16px;background:#fff;padding:4px;
  box-shadow:0 5px 15px #0001;z-index:5;
}
h1{margin:0;font-size:clamp(26px,4.5vw,44px);color:#1f7a4c}
.subtitle{font-size:18px;margin:7px 0 15px}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.stat{background:#fff;border-radius:18px;padding:9px 18px;box-shadow:0 5px 15px #0001;font-weight:800}
button{font:inherit;cursor:pointer;border:0}
#restart{background:#1f7a4c;color:#fff;border-radius:15px;padding:10px 18px;font-weight:800;transition:.2s}
#restart:hover{background:#165c38}
#soundBtn{background:#f39c12;color:#fff;border-radius:15px;padding:10px 18px;font-weight:800;transition:.2s}
#soundBtn:hover{background:#d68910}
#soundBtn.muted{background:#7f8c8d}
.game{max-width:1100px;margin:auto;padding:12px 18px 35px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{height:185px;perspective:900px}
.inner{width:100%;height:100%;position:relative;transition:.55s;transform-style:preserve-3d;cursor:pointer}
.card.open .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{
 position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;
 display:flex;align-items:center;justify-content:center;flex-direction:column;
 box-shadow:0 8px 18px #0002;border:4px solid #fff;text-align:center;
}
.back{background:linear-gradient(145deg,#289e63,#1d7a8c);color:#fff;font-size:32px}
.back small{font-size:15px;margin-top:8px}
.front{background:#fff;transform:rotateY(180deg);padding:12px}
.icon{font-size:36px;margin-bottom:8px;line-height:1}
.term{font-size:21px;font-weight:900;color:#1f7a4c;line-height:1.3}
.desc{font-size:15px;font-weight:700;color:#2c3e50;line-height:1.35}
.matched .front{background:#d9ffd9;border-color:#5ed36b}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-6px)}}
@keyframes pop{50%{transform:scale(1.08)}}
.matched{animation:pop .45s}
#message{text-align:center;min-height:34px;font-size:20px;font-weight:900;margin:10px 0 14px}
.overlay{position:fixed;inset:0;background:#1c3b2ccc;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.winbox{background:#fff;border-radius:30px;padding:35px;text-align:center;max-width:450px;box-shadow:0 20px 60px #0005}
.winbox h2{font-size:40px;margin:0 0 10px;color:#1f7a4c}
.winbox p{font-size:22px}
.winbox button{background:#1f7a4c;color:#fff;border-radius:15px;padding:12px 25px;font-weight:900;transition:.2s}
.winbox button:hover{background:#165c38}
.sparkles{font-size:42px}
@media(max-width:850px){
 header{padding-top:125px}
 .creator-logo{left:50%;transform:translateX(-50%)}
 .board{grid-template-columns:repeat(3,1fr);gap:10px}
 .card{height:175px}.term{font-size:19px}.desc{font-size:14px}
}
@media(max-width:520px){
 .board{grid-template-columns:repeat(2,1fr)}
 .card{height:185px}.icon{font-size:30px}.desc{font-size:13.5px}
}
</style>
</head>
<body>
<header>
<img src="t.jpg" alt="โลโก้ผู้สร้างเกม" class="creator-logo" onerror="this.style.display='none'">
<h1>💰 เกมจับคู่การออม และการลงทุน</h1>
<div class="subtitle">วิชาสังคมศึกษา : เปิดป้ายจับคู่ <b>คำศัพท์</b> กับ <b>ความหมาย</b> ให้ถูกต้อง</div>
<div class="stats">
 <div class="stat">⭐ คะแนน: <span id="score">0</span></div>
 <div class="stat">🔄 ครั้งที่เปิด: <span id="moves">0</span></div>
 <div class="stat">⏱️ เวลา: <span id="time">0</span> วินาที</div>
 <button id="soundBtn">🔊 เสียง: เปิด</button>
 <button id="restart">🔁 เริ่มใหม่</button>
</div>
</header>

<main class="game">
<div id="message">จับคู่ให้ครบทั้ง 6 คู่!</div>
<div class="board" id="board"></div>
</main>

<div class="overlay" id="overlay">
 <div class="winbox">
  <div class="sparkles">🎉 💰 🎊</div>
  <h2>ยอดเยี่ยมมาก!</h2>
  <p>จับคู่ครบทั้ง 6 คู่แล้ว</p>
  <p>คะแนน <b id="finalScore">0</b> คะแนน<br>ใช้เวลา <b id="finalTime">0</b> วินาที</p>
  <button id="again">เล่นอีกครั้ง</button>
 </div>
</div>

<script>
const pairs=[
 {
  id:1,
  a:["🐷","การออมเงิน","term"],
  b:["💵","การกันรายได้ส่วนที่เหลือและเก็บสะสมไว้ใช้","desc"]
 },
 {
  id:2,
  a:["🏦","เงินฝากออมทรัพย์","term"],
  b:["💳","บัญชีเงินฝาก ฝาก-ถอนได้ตลอด ผลตอบแทนต่ำ","desc"]
 },
 {
  id:3,
  a:["⏳","เงินฝากประจำ","term"],
  b:["📈","บัญชีเงินฝากที่ให้ดอกเบี้ยสูงแต่มีเงื่อนไขเรื่องระยะเวลา","desc"]
 },
 {
  id:4,
  a:["🌱","การลงทุน","term"],
  b:["💎","การนำเงินไปซื้อสินทรัพย์ต่างๆ เพื่อให้สร้างผลตอบแทนในอนาคต","desc"]
 },
 {
  id:5,
  a:["🏛️","พันธบัตรรัฐบาล","term"],
  b:["📜","ตราสารหนี้ที่ออกโดยกระทรวงการคลัง","desc"]
 },
 {
  id:6,
  a:["🏢","หุ้นกู้เอกชน","term"],
  b:["📑","ตราสารหนี้ที่ออกโดยบริษัทเอกชน ผู้ถือเป็นเจ้าหนี้ ได้ดอกเบี้ยสูงกว่าพันธบัตรรัฐบาล","desc"]
 }
];

// ระบบสร้างเสียงสังเคราะห์ (Web Audio API) ไม่ต้องพึ่งพาไฟล์เสียงภายนอก
let soundEnabled=true;
let audioCtx=null;
function initAudio(){
 if(!audioCtx){
  const AudioContext=window.AudioContext||window.webkitAudioContext;
  if(AudioContext)audioCtx=new AudioContext();
 }
 if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume();
}
function playTone(freq,type,duration,delay=0,vol=0.18){
 if(!soundEnabled)return;
 initAudio();
 if(!audioCtx)return;
 const osc=audioCtx.createOscillator();
 const gain=audioCtx.createGain();
 osc.type=type;
 osc.frequency.setValueAtTime(freq,audioCtx.currentTime+delay);
 gain.gain.setValueAtTime(vol,audioCtx.currentTime+delay);
 gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+delay+duration);
 osc.connect(gain);
 gain.connect(audioCtx.destination);
 osc.start(audioCtx.currentTime+delay);
 osc.stop(audioCtx.currentTime+delay+duration);
}
const sfx={
 flip:()=>playTone(520,"sine",0.12,0,0.15),
 match:()=>{
  playTone(523.25,"triangle",0.15,0,0.2);
  playTone(659.25,"triangle",0.15,0.1,0.2);
  playTone(783.99,"triangle",0.25,0.2,0.22);
 },
 wrong:()=>{
  playTone(260,"sawtooth",0.18,0,0.12);
  playTone(200,"sawtooth",0.22,0.14,0.12);
 },
 win:()=>{
  const notes=[523.25,659.25,783.99,1046.50,783.99,1046.50];
  notes.forEach((n,idx)=>playTone(n,"triangle",0.22,idx*0.12,0.22));
 },
 click:()=>playTone(440,"sine",0.1,0,0.15)
};

const soundBtn=document.getElementById("soundBtn");
soundBtn.onclick=()=>{
 soundEnabled=!soundEnabled;
 soundBtn.textContent=soundEnabled?"🔊 เสียง: เปิด":"🔇 เสียง: ปิด";
 soundBtn.classList.toggle("muted",!soundEnabled);
 if(soundEnabled)sfx.click();
};

let cards=[],first=null,second=null,lock=false,score=0,moves=0,time=0,timer=null,matched=0;

function makeCards(){
 cards=[];
 pairs.forEach(p=>{
  cards.push({pair:p.id,side:"a",icon:p.a[0],text:p.a[1],type:p.a[2]});
  cards.push({pair:p.id,side:"b",icon:p.b[0],text:p.b[1],type:p.b[2]});
 });
 cards.sort(()=>Math.random()-.5);
 const board=document.getElementById("board");
 board.innerHTML="";
 cards.forEach((c,i)=>{
  const el=document.createElement("div");
  el.className="card";el.dataset.i=i;el.dataset.pair=c.pair;
  el.innerHTML=`<div class="inner">
   <div class="face back">💰<small>เปิดป้าย</small></div>
   <div class="face front">
    <div class="icon">${c.icon}</div>
    <div class="${c.type}">${c.text}</div>
   </div>
  </div>`;
  el.onclick=()=>flip(el);
  board.appendChild(el);
 });
}
function flip(el){
 if(lock||el.classList.contains("open")||el.classList.contains("matched"))return;
 if(!timer){timer=setInterval(()=>{time++;document.getElementById("time").textContent=time},1000)}
 sfx.flip();
 el.classList.add("open");
 if(!first){first=el;return}
 second=el;moves++;document.getElementById("moves").textContent=moves;
 if(first.dataset.pair===second.dataset.pair){
  setTimeout(()=>sfx.match(),180);
  first.classList.add("matched");second.classList.add("matched");
  matched++;score+=10;document.getElementById("score").textContent=score;
  document.getElementById("message").textContent="🎉 ถูกต้อง! เก่งมาก";
  first=null;second=null;
  if(matched===pairs.length)setTimeout(win,650);
 }else{
  lock=true;
  setTimeout(()=>sfx.wrong(),220);
  first.classList.add("shake");second.classList.add("shake");
  document.getElementById("message").textContent="💡 ยังไม่ใช่ ลองจำตำแหน่งแล้วเปิดใหม่";
  setTimeout(()=>{
   first.classList.remove("open","shake");second.classList.remove("open","shake");
   first=null;second=null;lock=false;
  },1000);
 }
}
function win(){
 clearInterval(timer);timer=null;score+=50;
 sfx.win();
 document.getElementById("score").textContent=score;
 document.getElementById("finalScore").textContent=score;
 document.getElementById("finalTime").textContent=time;
 document.getElementById("overlay").style.display="flex";
}
function restart(playClick=false){
 if(playClick)sfx.click();
 clearInterval(timer);timer=null;first=second=null;lock=false;
 score=0;moves=0;time=0;matched=0;
 ["score","moves","time"].forEach(id=>document.getElementById(id).textContent="0");
 document.getElementById("message").textContent="จับคู่ให้ครบทั้ง 6 คู่!";
 document.getElementById("overlay").style.display="none";
 makeCards();
}
document.getElementById("restart").onclick=()=>restart(true);
document.getElementById("again").onclick=()=>restart(true);
restart(false);
</script>
</body>
</html>
